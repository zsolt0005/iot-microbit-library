[project]
name = "microbit"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "microfs>=1.4.5",
    "paho-mqtt>=2.1.0",
    "pyright>=1.1.414",
    "pyserial>=3.5",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
extend-exclude = ["typeshed", "bench.py"]  # bench.py: temporary, uses the old module names

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["UP"]  # MicroPython does not support all modern syntax

[tool.pytest.ini_options]
testpaths = ["tests/unit"]  # integration tests need Docker: pytest tests/integration

[tool.ruff.lint.isort]
# our http.py shadows the CPython package of the same name; it does not exist on the micro:bit
known-first-party = ["bme280", "config", "dust", "http", "noise", "oled", "pir", "rtc", "soil",
                     "sonar", "thingspeak", "uvlevel", "water", "wifi"]
known-third-party = ["microbit", "micropython", "utime", "machine", "ustruct", "conftest"]
